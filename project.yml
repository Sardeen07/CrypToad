# XcodeGen spec — run `xcodegen generate` to create CrypToad.xcodeproj
name: CrypToad
options:
  bundleIdPrefix: com.sardeen07
  deploymentTarget:
    iOS: "17.0"
packages:
  CrypToadCore:
    path: CrypToadCore
targets:
  CrypToad:
    type: application
    platform: iOS
    sources:
      - CrypToad
    dependencies:
      - package: CrypToadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sardeen07.cryptoad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "CrypToad uses Face ID to lock the app and protect your card details."
        INFOPLIST_KEY_CFBundleDisplayName: CrypToad
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
