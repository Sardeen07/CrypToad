# XcodeGen spec — run `xcodegen generate` to create CrypToad.xcodeproj
name: CrypToad
options:
  bundleIdPrefix: com.sardeen07
  deploymentTarget:
    iOS: "17.0"
packages:
  CrypToadCore:
    path: CrypToadCore
targets:
  CrypToad:
    type: application
    platform: iOS
    sources:
      - CrypToad
    dependencies:
      - package: CrypToadCore
    info:
      path: CrypToad/Support/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where the app looks for the backend by default (editable in Settings).
        CrypToadServerURL: $(CRYPTOAD_SERVER_URL)
        # Lets the simulator talk to a backend on http://localhost during development.
        # Deployed servers use HTTPS, which needs no exception.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CRYPTOAD_SERVER_URL: "http://localhost:8000"
        # Sign in with Apple needs a paid Apple Developer team. Once you have one, uncomment:
        # DEVELOPMENT_TEAM: YOUR_TEAM_ID
        # CODE_SIGN_ENTITLEMENTS: CrypToad/Support/CrypToad.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sardeen07.cryptoad
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "CrypToad uses Face ID to lock the app and protect your card details."
        INFOPLIST_KEY_CFBundleDisplayName: CrypToad
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
    scheme:
      testTargets:
        - CrypToadUITests

  CrypToadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CrypToadUITests
    dependencies:
      - target: CrypToad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sardeen07.cryptoad.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
