name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run CrypToadCore tests
        run: swift test --package-path CrypToadCore

  ios:
    name: Core tests + iOS build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run CrypToadCore tests
        run: swift test --package-path CrypToadCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project CrypToad.xcodeproj \
            -scheme CrypToad \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
