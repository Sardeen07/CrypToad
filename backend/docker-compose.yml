# Local stack: PostgreSQL + the CrypToad API.
#   docker compose up --build
#   open http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptoad
      POSTGRES_PASSWORD: cryptoad   # local development only
      POSTGRES_DB: cryptoad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoad"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      CRYPTOAD_DATABASE_URL: postgresql+psycopg://cryptoad:cryptoad@db:5432/cryptoad
      CRYPTOAD_PRICE_SOURCE: coingecko
      CRYPTOAD_ENABLE_DEV_ENDPOINTS: "true"
      CRYPTOAD_SECRET_KEY: local-development-only-secret
      # Bank linking: copy your Plaid Sandbox keys into backend/.env (never commit them).
      CRYPTOAD_PLAID_CLIENT_ID: ${CRYPTOAD_PLAID_CLIENT_ID:-}
      CRYPTOAD_PLAID_SECRET: ${CRYPTOAD_PLAID_SECRET:-}
      CRYPTOAD_PLAID_ENV: sandbox
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
